<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1680" viewBox="0 0 1120 1680" font-family="Segoe UI, Arial, sans-serif">
<rect width="1120" height="1680" fill="#ffffff"/>

<rect x="0" y="0" width="1120" height="96" fill="#1f2430"/>
<text x="40" y="48" fill="#ffffff" font-size="32" font-weight="700">Making your own tree — 2 roads</text>
<text x="40" y="80" fill="#9fb3c8" font-size="19">Road A is what you are doing now. Road B is the real thing. Finish A first.</text>

<!-- ROAD A -->
<rect x="40" y="130" width="1040" height="255" rx="12" fill="#e8f7ec" stroke="#2e9e54" stroke-width="3"/>
<text x="70" y="172" font-size="26" font-weight="700" fill="#1e7a3e">ROAD A — Retexture  (you are here)</text>
<text x="70" y="205" font-size="18" fill="#2b6b42">Take a tree that already exists. Paint new pictures on it. The shape stays the same.</text>

<rect x="70" y="228" width="220" height="56" rx="8" fill="#fff" stroke="#2e9e54" stroke-width="2"/>
<text x="180" y="262" font-size="17" text-anchor="middle" fill="#1e7a3e" font-weight="600">Paint.NET</text>
<text x="308" y="263" font-size="24" fill="#2e9e54">→</text>
<rect x="345" y="228" width="220" height="56" rx="8" fill="#fff" stroke="#2e9e54" stroke-width="2"/>
<text x="455" y="262" font-size="17" text-anchor="middle" fill="#1e7a3e" font-weight="600">OpenIV Replace</text>
<text x="583" y="263" font-size="24" fill="#2e9e54">→</text>
<rect x="620" y="228" width="220" height="56" rx="8" fill="#fff" stroke="#2e9e54" stroke-width="2"/>
<text x="730" y="262" font-size="17" text-anchor="middle" fill="#1e7a3e" font-weight="600">stream folder</text>

<text x="70" y="318" font-size="18" fill="#2b6b42"><tspan font-weight="700">Time:</tspan>  1 evening.        <tspan font-weight="700">Difficulty:</tspan>  easy.</text>
<text x="70" y="350" font-size="18" fill="#2b6b42"><tspan font-weight="700">Limit:</tspan>  the tree keeps the olive shape. Branches stay olive branches.</text>
<text x="70" y="375" font-size="17" fill="#3f7d55">For 95% of servers this is enough. Nobody notices.</text>

<!-- ROAD B -->
<rect x="40" y="415" width="1040" height="960" rx="12" fill="#f5f7fa" stroke="#2d6cdf" stroke-width="3"/>
<text x="70" y="457" font-size="26" font-weight="700" fill="#1a4fa8">ROAD B — Build a real new tree</text>
<text x="70" y="490" font-size="18" fill="#33475e">You make the 3D shape yourself. Branches, trunk, everything.</text>
<text x="70" y="518" font-size="18" fill="#a82d68" font-weight="700">Warning: this is weeks of learning, not one evening. 5 new programs.</text>

<!-- step 1 -->
<rect x="70" y="545" width="980" height="105" rx="8" fill="#fff" stroke="#bcc6d2" stroke-width="2"/>
<circle cx="110" cy="580" r="20" fill="#2d6cdf"/><text x="110" y="588" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">1</text>
<text x="145" y="588" font-size="21" font-weight="700" fill="#1f2430">Make the tree shape</text>
<text x="145" y="618" font-size="17" fill="#444">Easiest:  <tspan font-weight="700" fill="#1a4fa8">Tree It</tspan>  (free, made for games, exports .obj — start here)</text>
<text x="145" y="642" font-size="17" fill="#444">Or:  <tspan font-weight="700">Blender</tspan> + built-in <tspan font-weight="700">Sapling Tree Gen</tspan> addon (free)</text>

<!-- step 2 -->
<rect x="70" y="662" width="980" height="105" rx="8" fill="#fff" stroke="#bcc6d2" stroke-width="2"/>
<circle cx="110" cy="697" r="20" fill="#2d6cdf"/><text x="110" y="705" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">2</text>
<text x="145" y="705" font-size="21" font-weight="700" fill="#1f2430">Make the leaf + bark pictures</text>
<text x="145" y="735" font-size="17" fill="#444">Same job you are doing right now in Paint.NET. <tspan font-weight="700" fill="#1e7a3e">You already know this step ✔</tspan></text>
<text x="145" y="759" font-size="17" fill="#444">512x512, DXT5, mipmaps on.</text>

<!-- step 3 -->
<rect x="70" y="779" width="980" height="130" rx="8" fill="#fff" stroke="#bcc6d2" stroke-width="2"/>
<circle cx="110" cy="814" r="20" fill="#2d6cdf"/><text x="110" y="822" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">3</text>
<text x="145" y="822" font-size="21" font-weight="700" fill="#1f2430">Put it in Blender + Sollumz</text>
<text x="145" y="852" font-size="17" fill="#444"><tspan font-weight="700" fill="#1a4fa8">Sollumz</tspan> is a free Blender addon. It is the bridge between Blender and GTA.</text>
<text x="145" y="876" font-size="17" fill="#444">Set the material shader to <tspan font-family="Consolas, monospace" font-weight="700">trees_normal_diffspec</tspan></text>
<text x="145" y="900" font-size="17" fill="#a82d68">This step is where most people give up. Watch a Sollumz tutorial first.</text>

<!-- step 4 -->
<rect x="70" y="921" width="980" height="82" rx="8" fill="#fff" stroke="#bcc6d2" stroke-width="2"/>
<circle cx="110" cy="956" r="20" fill="#2d6cdf"/><text x="110" y="964" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">4</text>
<text x="145" y="956" font-size="21" font-weight="700" fill="#1f2430">Export as .ydr</text>
<text x="145" y="986" font-size="17" fill="#444">Sollumz → Export → .ydr   (this is the GTA model file)</text>

<!-- step 5 -->
<rect x="70" y="1015" width="980" height="82" rx="8" fill="#fff" stroke="#bcc6d2" stroke-width="2"/>
<circle cx="110" cy="1050" r="20" fill="#2d6cdf"/><text x="110" y="1058" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">5</text>
<text x="145" y="1050" font-size="21" font-weight="700" fill="#1f2430">Pack the pictures into a .ytd</text>
<text x="145" y="1080" font-size="17" fill="#444">OpenIV → New → .ytd → drag your .dds files in</text>

<!-- step 6 -->
<rect x="70" y="1109" width="980" height="105" rx="8" fill="#fff" stroke="#bcc6d2" stroke-width="2"/>
<circle cx="110" cy="1144" r="20" fill="#2d6cdf"/><text x="110" y="1152" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">6</text>
<text x="145" y="1152" font-size="21" font-weight="700" fill="#1f2430">Make .ytyp and .ymap in CodeWalker</text>
<text x="145" y="1182" font-size="17" fill="#444"><tspan font-weight="700">.ytyp</tspan> = tells the game "this prop exists"</text>
<text x="145" y="1206" font-size="17" fill="#444"><tspan font-weight="700">.ymap</tspan> = tells the game "put one here, here and here on the map"</text>

<!-- step 7 -->
<rect x="70" y="1226" width="980" height="128" rx="8" fill="#e8f7ec" stroke="#2e9e54" stroke-width="2"/>
<circle cx="110" cy="1261" r="20" fill="#2e9e54"/><text x="110" y="1269" fill="#fff" font-size="21" font-weight="700" text-anchor="middle">7</text>
<text x="145" y="1269" font-size="21" font-weight="700" fill="#1e7a3e">Put it on your server</text>
<text x="145" y="1299" font-size="17" fill="#2b6b42">Folder with a <tspan font-family="Consolas, monospace" font-weight="700">stream/</tspan> subfolder + <tspan font-family="Consolas, monospace" font-weight="700">fxmanifest.lua</tspan></text>
<text x="145" y="1325" font-size="16" font-family="Consolas, monospace" fill="#2b6b42">fx_version 'cerulean'   game 'gta5'   files {'*.ytyp'}   data_file 'DLC_ITYP_REQUEST' '*.ytyp'</text>

<!-- ADVICE -->
<rect x="40" y="1405" width="1040" height="240" rx="12" fill="#fff8e6" stroke="#e0a800" stroke-width="3"/>
<text x="70" y="1448" font-size="24" font-weight="700" fill="#8a6a00">My advice for you</text>
<text x="70" y="1488" font-size="19" fill="#5c4a00">1.  Finish Road A first. Fix the 512x512 and the mipmaps. Get it working in game.</text>
<text x="70" y="1522" font-size="19" fill="#5c4a00">2.  Only then download <tspan font-weight="700">Tree It</tspan> and play with it. It is free and simple.</text>
<text x="70" y="1556" font-size="19" fill="#5c4a00">3.  Learn <tspan font-weight="700">Blender + Sollumz</tspan> last. That is the hard part, do not start there.</text>
<text x="70" y="1596" font-size="18" fill="#8a6a00">Do not try to learn all of Road B in one day. You will get confused and stop.</text>
<text x="70" y="1624" font-size="18" fill="#8a6a00">One step at a time. Ask me when you are stuck on one step.</text>
</svg>
